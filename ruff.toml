# Ruff configuration for SZGMU Schedule Bot
# Target: 0 warnings with all important rules

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "PERF",   # perflint
    "RUF",    # ruff-specific
]

ignore = [
    # Russian language project - allow Cyrillic
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment

    # Docstring style - using Google style
    "D203",    # one-blank-line-before-class
    "D213",    # multi-line-summary-second-line

    # Too strict for practical code
    "TD002",   # missing-todo-author (todos don't need author in small team)
    "TD003",   # missing-todo-link
    "FIX002",  # line-contains-todo

    # Allow magic values in tests and configs
    "PLR2004", # magic-value-comparison (in tests)

    # Complexity limits - will fix gradually
    "C901",    # complex-structure (too-complex)
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "PLR0911", # too-many-return-statements

    # Allow Any for flexibility in data processing
    "ANN401",  # any-type

    # Telegram bot specific
    "S501",    # request-with-no-cert-validation (SZGMU API has SSL issues)
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert-used (asserts are for tests)
    "PLR2004", # magic-value-comparison
    "ANN",     # Type annotations not required in tests
    "D",       # Docstrings not required in tests
    "ARG",     # Unused arguments (fixtures)
]

"__init__.py" = [
    "F401",    # unused-import (re-exports)
    "D104",    # undocumented-public-package
]

"app/bot/**/*.py" = [
    "PLR0913", # too-many-arguments (handlers have many params)
    "ARG002",  # unused-method-argument (callback params)
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[lint.isort]
known-first-party = ["app", "tests"]
force-single-line = false
